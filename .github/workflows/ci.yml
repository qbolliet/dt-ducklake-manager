name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Annulation des exécutions obsolètes : un nouveau push sur la même réf
# annule le run précédent encore en cours (économie de minutes CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Installer les dépendances de développement
        run: uv sync --group dev

      - name: Vérification du style (ruff)
        run: uv run ruff check .

      - name: Vérification du formatage (ruff)
        run: uv run ruff format --check .

      - name: Vérification des types (mypy)
        run: uv run mypy dt_ducklake_manager/

  test:
    name: Tests
    runs-on: ubuntu-latest

    # Serveur PostgreSQL éphémère pour les tests d'intégration du backend
    # catalogue Postgres (concurrence lecture/écriture). Sans ce service, le
    # test correspondant est ignoré (skipif) et la CI passe au vert sans le
    # couvrir réellement.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ducklake
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d ducklake"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    # Paramètres de connexion lus par les tests d'intégration Postgres
    # (cf. _postgres_test_params dans tests/unit/test_connection/test_connector.py).
    env:
      DUCKLAKE_TEST_PG_HOST: localhost
      DUCKLAKE_TEST_PG_PORT: "5432"
      DUCKLAKE_TEST_PG_DB: ducklake
      DUCKLAKE_TEST_PG_USER: app
      DUCKLAKE_TEST_PG_PASSWORD: secret

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Installer les dépendances de développement
        run: uv sync --group dev

      - name: Exécution des tests unitaires
        run: uv run pytest -m "not integration"

      - name: Exécution des tests d'intégration
        run: uv run pytest -m integration
