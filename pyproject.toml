[project]
name = "dashboard-template-database"
version = "0.1.0"
description = "DuckDB Database for dashboard template"
authors = [{ name = "Quentin Bolliet", email = "bolliet.quentin@gmail.com" }]
requires-python = "~=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "numpy>=2.1.3,<3",
    "pandas>=2.2.3,<3",
    "duckdb>=1.1.3,<2",
    "pathlib>=1.0.1,<2",
    "boto3>=1.34.34,<2",
    "s3fs>=2024.2.0,<2025",
    "openpyxl>=3.1.5,<4",
    "pyarrow>=19.0.0,<20",
    "fastparquet>=2024.11.0,<2025",
    "xlsxwriter>=3.2.1,<4",
    "geopandas>=1.0.1,<2",
    "matplotlib>=3.10.1,<4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5,<7",
    "pytest>=8.3.4,<9",
    "moto[s3]>=5.0.27,<6",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocstrings-python>=1.13.0,<2",
    "mkdocs-material>=9.5.49,<10",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
