[project]
name = "dt-ducklake-manager"
version = "0.1.0"
description = "DuckDB Database for dashboard template"
authors = [{ name = "Quentin Bolliet", email = "bolliet.quentin@gmail.com" }]
requires-python = ">=3.13,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "duckdb>=1.5.2,<2",
    "narwhals>=1.48.1,<2",
    "polars>=1.39.3,<2",
    "pyarrow>=23.0.1",
]

[dependency-groups]
dev = [
    "bump-my-version>=1.3.0",
    "git-cliff>=2.12.0",
    "ipykernel>=6.29.5",
    "mypy>=1.20.1",
    "pandas>=3.0.2",
    "pytest>=8.3.4",
    "ruff>=0.15.10",
    "taskipy>=1.14.1",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocstrings-python>=1.13.0",
    "mkdocs-material>=9.5.49,<10",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end integration tests",
    "slow: tests that take a long time to run",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.bumpversion]
current_version = "0.1.0"
commit = false
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.taskipy.tasks]
test = "pytest -m \"not integration\""
test-integration = "pytest -m integration"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy dt_ducklake_manager/"
changelog = "git-cliff --output CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
