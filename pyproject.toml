[project]
name = "dashboard-template-database"
version = "0.1.0"
description = "DuckDB Database for dashboard template"
authors = [{ name = "Quentin Bolliet", email = "bolliet.quentin@gmail.com" }]
requires-python = ">=3.13,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "duckdb>=1.1.3,<2",
    "narwhals>=1.48.1,<2",
    "polars>=1.39.3,<2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.4",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocstrings-python>=1.13.0",
    "mkdocs-material>=9.5.49,<10",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end integration tests",
    "slow: tests that take a long time to run",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
