site_name: Ducklake Manager
site_url: https://qbolliet.github.io/dt-ducklake-manager/
repo_url: https://github.com/qbolliet/dt-ducklake-manager
site_dir: site
docs_dir: docs
theme:
  name: material
  pygments_style: lovelace
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
  - content.tabs.link
  - content.code.annotate
  - content.code.copy
  - navigation.sections
  - navigation.path
  palette:
  - scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
markdown_extensions:
- tables
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences
- markdown.extensions.sane_lists
- pymdownx.arithmatex:
    generic: true
plugins:
- search
- autorefs
- mkdocstrings:
    handlers:
      python:
        paths:
        - src
        - docs/snippets
        inventories:
        - https://docs.python.org/3/objects.inv
        - https://mkdocstrings.github.io/objects.inv
        - https://mkdocstrings.github.io/autorefs/objects.inv
        - https://mkdocstrings.github.io/griffe/objects.inv
        - https://python-markdown.github.io/objects.inv
        options:
          docstring_options:
            ignore_init_summary: true
          show_root_heading: true
          merge_init_into_class: false
          docstring_style: google
          docstring_section_style: table
          heading_level: 1
          filters:
          - '!^_'
          inherited_members: true
          parameter_headings: true
          preload_modules:
          - mkdocstrings
          relative_crossrefs: true
          scoped_crossrefs: true
          separate_signature: true
          show_bases: false
          show_inheritance_diagram: true
          show_root_full_path: false
          show_signature_annotations: true
          show_source: true
          show_symbol_type_heading: false
          show_symbol_type_toc: true
          signature_crossrefs: true
          summary: true
          unwrap_annotated: true
extra_javascript:
- https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML
nav:
- Package description: index.md
- Schema and data model: schema.md
- Storage lifecycle and maintenance: maintenance.md
- Architecture & trade-offs: architecture.md
- API Documentation:
  - connection:
    - DuckLakeConnector: api/connection/DuckLakeConnector.md
    - CatalogType: api/connection/CatalogType.md
  - maintenance:
    - ValidationLevel: api/maintenance/ValidationLevel.md
    - IssueType: api/maintenance/IssueType.md
    - IssueSeverity: api/maintenance/IssueSeverity.md
    - ValidationIssue: api/maintenance/ValidationIssue.md
    - ValidationReport: api/maintenance/ValidationReport.md
    - DatabaseAuditor: api/maintenance/DatabaseAuditor.md
    - DuckLakeMaintenance: api/maintenance/DuckLakeMaintenance.md
    - MaintenancePolicy: api/maintenance/MaintenancePolicy.md
    - StorageReport: api/maintenance/StorageReport.md
    - RecoveryStrategy: api/maintenance/RecoveryStrategy.md
    - RecoveryOperation: api/maintenance/RecoveryOperation.md
    - RecoveryResult: api/maintenance/RecoveryResult.md
    - DatabaseRecoveryManager: api/maintenance/DatabaseRecoveryManager.md
  - operations:
    - DatabaseDeleter: api/operations/DatabaseDeleter.md
    - DatabaseUpdater: api/operations/DatabaseUpdater.md
    - BaseSchemaManager: api/operations/BaseSchemaManager.md
    - DataManager: api/operations/DataManager.md
  - reporting:
    - OperationReport: api/reporting/OperationReport.md
  - schema:
    - SchemaBuilder: api/schema/SchemaBuilder.md
    - DuckLakeTablesBuilder: api/schema/DuckLakeTablesBuilder.md
  - utils:
    - remove_dataframe_duplicates: api/utils/remove_dataframe_duplicates.md
    - build_database_duplicate_removal_query: api/utils/build_database_duplicate_removal_query.md
    - map_python_to_sql_type: api/utils/map_python_to_sql_type.md
    - quote_ident: api/utils/quote_ident.md
    - qualify_table: api/utils/qualify_table.md
    - SchemaScoped: api/utils/SchemaScoped.md
    - METADATA_COLUMNS: api/utils/METADATA_COLUMNS.md
    - get_column_hierarchies: api/utils/get_column_hierarchies.md
    - get_value_label_columns: api/utils/get_value_label_columns.md
    - validate_value_labels: api/utils/validate_value_labels.md
    - check_value_label_dependency: api/utils/check_value_label_dependency.md
